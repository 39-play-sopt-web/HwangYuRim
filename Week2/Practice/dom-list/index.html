<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[2주차] DOM 실습</title>
  </head>
  <body>
    <button onclick="onClick()">리스트 추가</button>
    <ul id="ul"></ul>

    <script>
      const onClick = () => {
        const ul = document.getElementById("ul");
        let list = "";

        for (let i = 1; i <= 3000; i++) {
          list += `<li>${i}</li>`;
        }

        ul.innerHTML = list;
      };
    </script>
  </body>
</html>
